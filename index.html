<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artools Precision Pen — A caneta mais tecnológica do mundo</title>
    <meta name="description"
        content="Artools Precision Pen redefine o equilíbrio entre peso, fluxo e design. Feita para criadores que exigem perfeição em cada traço.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- CDN Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

    <style>
        /* ==========================================
           1. RESET + VARIÁVEIS
           ========================================== */
        :root {
            --base: #FFFFFF;
            --obsidian: #09090B;
            --charcoal: #1C1C1C;
            --muted: #71717A;
            --font-main: 'Inter', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: var(--font-main);
            background-color: var(--obsidian);
            color: var(--base);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body {
            overflow-x: hidden;
            width: 100vw;
        }

        /* Lenis Required CSS */
        html.lenis,
        html.lenis body {
            height: auto;
        }

        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }

        .lenis.lenis-smooth [data-lenis-prevent] {
            overscroll-behavior: contain;
        }

        .lenis.lenis-stopped {
            overflow: hidden;
        }

        .lenis.lenis-scrolling iframe {
            pointer-events: none;
        }

        /* ==========================================
           2. HEADER
           ========================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.3); /* Escurecido para dar mais destaque */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-logo {
            font-weight: 700;
            font-size: 18px;
            color: #FFFFFF;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo::before {
            content: "";
            display: block;
            width: 12px;
            height: 12px;
            background-color: #FFFFFF;
        }

        .header-nav {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .header-nav a {
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 600; /* Mais destaque */
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-decoration: none;
            opacity: 1; /* Opacidade total para não sumir */
            text-shadow: 0 2px 4px rgba(0,0,0,0.6); /* Sombra para destacar em fundos claros */
            transition: all 0.3s;
            position: relative;
        }

        .header-nav a:hover {
            opacity: 0.8;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .header-nav span.separator {
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .header-cart {
            font-size: 18px;
            color: #FFFFFF;
            text-decoration: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .hamburger {
            display: none;
            color: #FFFFFF;
            font-size: 24px;
            cursor: pointer;
        }

        /* ==========================================
           3. HERO SECTION
           ========================================== */
        #hero {
            position: relative;
            width: 100%;
            height: 400vh;
            /* Scrollable area */
            background-color: var(--obsidian);
        }

        .hero-container {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* ==========================================
           4. VÍDEO + OVERLAY
           ========================================== */
        #hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
            will-change: transform;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            /* Overlay em duas camadas como exigido */
            background:
                linear-gradient(to right, rgba(0, 0, 0, 0.6) 0%, transparent 50%, rgba(0, 0, 0, 0.1) 100%),
                linear-gradient(to bottom, transparent 60%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
        }

        /* ==========================================
           5. HERO CONTENT & TEXTS
           ========================================== */
        .hero-content {
            position: absolute;
            top: 12%;
            left: 8%;
            max-width: 700px; /* Slightly wider for the new font sizes */
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 80vh;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #FFFFFF;
            border-radius: 50%;
        }

        .badge-text {
            font-family: var(--font-mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.7);
        }

        .hero-title {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            gap: 0;
            font-family: var(--font-display);
            line-height: 0.9;
            letter-spacing: -0.02em;
        }

        .hero-title span {
            display: block;
        }

        .hero-title .line-1 {
            font-weight: 700;
            color: #FFFFFF;
            font-size: clamp(3rem, 7vw, 5.5rem);
        }

        .hero-title .line-2 {
            font-weight: 700;
            font-size: clamp(3rem, 7vw, 5.5rem);
            color: transparent;
            -webkit-text-stroke: 1.5px #FFFFFF;
            letter-spacing: 0;
        }

        .hero-title .line-3 {
            font-weight: 700;
            color: #FFFFFF;
            font-size: clamp(3rem, 7vw, 5.5rem);
        }

        /* ==========================================
           6. PARÁGRAFO
           ========================================== */
        .hero-description {
            font-family: var(--font-main);
            font-weight: 300;
            font-size: clamp(1.125rem, 1.5vw, 1.25rem);
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            max-width: 520px;
            margin-top: 16px;
            margin-bottom: 40px;
        }

        /* ==========================================
           7. CTAs (BOTÕES)
           ========================================== */
        .hero-ctas {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-magnetic {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            padding: 0 32px;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-family: var(--font-main);
            font-size: 14px;
            letter-spacing: 0.05em;
            will-change: transform;
        }

        .btn-primary {
            background-color: #FFFFFF;
            color: #09090B;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-4px);
        }

        /* ==========================================
           8. INDICADORES & PROMPT
           ========================================== */
        .hero-indicator {
            position: absolute;
            right: 4%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #progress-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .indicator-line {
            width: 1px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.5);
        }

        .hero-scroll {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .hero-scroll span {
            font-size: 11px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            animation: pulse-scroll 2s infinite;
        }

        .hero-scroll .scroll-line {
            width: 1px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.4);
        }

        @keyframes pulse-scroll {
            0% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 0.3;
            }
        }

        /* ==========================================
           10. PARTÍCULAS (Opcional)
           ========================================== */
        .particles-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
        }

        /* ==========================================
           12. RESPONSIVO
           ========================================== */
        @media (max-width: 1024px) {
            .hero-content {
                left: 8%;
                right: 8%;
                max-width: none;
                align-items: center;
                text-align: center;
            }

            .hero-title .line-1,
            .hero-title .line-2,
            .hero-title .line-3 {
                font-size: clamp(2.5rem, 5vw, 3.8rem);
            }
        }

        @media (max-width: 768px) {
            .header-nav {
                display: none;
            }

            .hamburger {
                display: block;
            }

            .hero-title .line-1,
            .hero-title .line-2,
            .hero-title .line-3 {
                font-size: clamp(2rem, 8vw, 2.8rem);
            }

            .hero-ctas {
                flex-direction: column;
                width: 100%;
                gap: 12px;
            }

            .btn-magnetic {
                width: 100%;
            }

            .hero-indicator,
            .hero-scroll {
                display: none;
                /* Oculto em mobile */
            }
        }

        /* ==========================================
           13. PREFERS REDUCED MOTION
           ========================================== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Outras seções globais */
        .next-section {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            background-color: var(--obsidian);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header role="banner">
        <a href="#" class="header-logo">ARTOOLS.</a>
        <nav class="header-nav" aria-label="Navegação Principal">
            <a href="#">Design</a>
            <span class="separator">|</span>
            <a href="#">Technology</a>
            <span class="separator">|</span>
            <a href="#">Specs</a>
        </nav>
        <a href="#" class="header-cart" aria-label="Carrinho">👜</a>
        <div class="hamburger">☰</div>
    </header>

    <!-- HERO SECTION -->
    <section id="hero">
        <div class="hero-container">
            <!-- VÍDEO -->
            <video id="hero-video" src="assets/White_pen_writing__Crie._Desenhe…_202607081614.mp4"
                poster="assets/White_ARTOOLS_pen_floating_diago…_202607091112.jpeg" muted playsinline preload="auto">
            </video>

            <!-- OVERLAYS -->
            <div class="hero-overlay"></div>
            <div class="particles-layer"></div>

            <!-- CONTENT -->
            <div class="hero-content">
                <!-- BADGE -->
                <div class="hero-badge" aria-hidden="true">
                    <span class="badge-dot"></span>
                    <span class="badge-text">Precision Series</span>
                </div>

                <h1 class="hero-title" aria-label="A caneta mais tecnológica do mundo.">
                    <span class="line-1">A caneta</span>
                    <span class="line-2">mais tecnológica</span>
                    <span class="line-3">do mundo.</span>
                </h1>

                <p class="hero-description">
                    A Artools Precision Pen redefine o equilíbrio entre peso, fluxo e design. Feita para criadores que
                    exigem perfeição em cada traço.
                </p>

                <div class="hero-ctas">
                    <button class="btn-primary btn-magnetic" aria-label="Comprar Artools Precision Pen">Comprar
                        Agora</button>
                    <button class="btn-secondary btn-magnetic" aria-label="Explorar produto">Explorar ↓</button>
                </div>
            </div>

            <!-- INDICATORS -->
            <div class="hero-indicator" aria-hidden="true">
                <span id="progress-text">01</span>
                <div class="indicator-line"></div>
            </div>

            <!-- PROMPT -->
            <div class="hero-scroll" aria-hidden="true">
                <span>SCROLL TO CONTROL</span>
                <div class="scroll-line"></div>
            </div>
        </div>
    </section>

    <!-- NEXT SECTION (Placeholder) -->
    <!-- <section class="next-section">
        <div style="text-align: center;">
            <h2 style="font-weight: 600; font-size: 3rem; margin-bottom: 20px;">O fluxo continua</h2>
            <p style="color: var(--muted); font-size: 1.2rem;">Conteúdo fluindo livremente após o parallax hero.</p>
        </div>
    </section> -->

    <!-- SCRIPTS -->
    <script>
        // Registrar ScrollTrigger
        gsap.registerPlugin(ScrollTrigger);

        const video = document.getElementById('hero-video');
        const heroSection = document.getElementById('hero');
        const progressText = document.getElementById('progress-text');
        const heroScrollPrompt = document.querySelector('.hero-scroll');
        const isMobile = window.innerWidth < 768;

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ==========================================
           1. LENIS SETUP
           ========================================== */
        let lenis;
        if (!prefersReducedMotion && !isMobile) {
            lenis = new Lenis({
                duration: 1.2,
                easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                orientation: 'vertical',
                smoothWheel: true,
                wheelMultiplier: 1,
                touchMultiplier: 2,
            });

            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }
            requestAnimationFrame(raf);

            lenis.on('scroll', ScrollTrigger.update);
            gsap.ticker.add((time) => {
                lenis.raf(time * 1000);
            });
            gsap.ticker.lagSmoothing(0, 0);
        }

        /* ==========================================
           2. GSAP ENTRANCE TIMELINE
           ========================================== */
        if (!prefersReducedMotion) {
            const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

            // Video Blur Reveal
            gsap.fromTo(video, { filter: 'blur(8px)' }, { filter: 'blur(0px)', duration: 1.5, ease: 'power2.out' });

            // Header
            tl.from('header', { y: -30, opacity: 0, duration: 0.8 }, 0.2);

            // Headline & Badge
            tl.from('.hero-badge', { y: 20, opacity: 0, duration: 0.8 }, 0.4);
            tl.from('.hero-title .line-1', { y: 60, opacity: 0, scale: 0.95, duration: 1.2 }, 0.6);
            tl.from('.hero-title .line-2', { y: 60, opacity: 0, scale: 0.95, duration: 1.2 }, 0.9);
            tl.from('.hero-title .line-3', { y: 60, opacity: 0, scale: 0.95, duration: 1.2 }, 1.2);

            // Description
            tl.from('.hero-description', { y: 40, opacity: 0, duration: 1 }, 1.6);

            // Buttons
            tl.from('.hero-ctas .btn-primary', { y: 30, opacity: 0, duration: 0.8 }, 2.0);
            tl.from('.hero-ctas .btn-secondary', { y: 30, opacity: 0, duration: 0.8 }, 2.2);

            // Indicators
            if (!isMobile) {
                tl.from('.hero-indicator', { opacity: 0, duration: 0.6 }, 2.0);
                tl.from('.hero-scroll', { opacity: 0, duration: 0.6 }, 2.0);
            }
        }

        /* ==========================================
           3. VIDEO PARALLAX & PROMPT FADE
           ========================================== */
        if (!prefersReducedMotion && !isMobile) {
            function initVideoParallax() {
                // Cria uma timeline atrelada ao scroll (Scrub Timeline)
                const scrubTl = gsap.timeline({
                    scrollTrigger: {
                        trigger: heroSection,
                        start: 'top top',
                        end: 'bottom bottom',
                        scrub: 1,
                        invalidateOnRefresh: true,
                        onUpdate: (self) => {
                            // Update Indicator (01 -> 02 -> 03)
                            const prog = self.progress;
                            if (prog < 0.33) progressText.innerText = "01";
                            else if (prog < 0.66) progressText.innerText = "02";
                            else progressText.innerText = "03";
                        }
                    }
                });

                // 1. Anima o vídeo do frame 0 ao final
                scrubTl.fromTo(video,
                    { currentTime: 0 },
                    { currentTime: video.duration - 0.1, ease: 'none' },
                    0 // inicia no tempo 0 da timeline
                );

                // 2. Anima os componentes da tela (Exibindo e Sumindo)

                // Fade out do SCROLL TO CONTROL rapidamente no início do scroll
                scrubTl.to(heroScrollPrompt, { opacity: 0, duration: 0.1 }, 0);

                // Fade out da Headline e Parágrafo após 25% do scroll
                scrubTl.to('.hero-title, .hero-description', {
                    opacity: 0,
                    y: -40,
                    duration: 0.2,
                    stagger: 0.05
                }, 0.25);

                // No final do scroll (perto de 80%), damos destaque aos botões centralizando-os
                // Mas a estrutura pediu alinhado à esquerda. Vamos apenas fazer um fade out suave
                // e trazer o indicador junto.
                scrubTl.to('.hero-ctas', {
                    opacity: 0,
                    y: -20,
                    duration: 0.15
                }, 0.45);
            }

            // Garante que o ScrollTrigger só seja criado QUANDO o vídeo tiver os dados de duração
            if (video.readyState >= 1) {
                initVideoParallax();
            } else {
                video.addEventListener('loadedmetadata', initVideoParallax);
            }
        } else if (prefersReducedMotion || isMobile) {
            // Autoplay on mobile or reduced motion
            video.autoplay = true;
            video.loop = true;
            video.play().catch(e => console.log('Autoplay blocked:', e));
            // Remove the huge 400vh scroll height for a static block
            heroSection.style.height = '100vh';
        }

        /* ==========================================
           5. MAGNETIC BUTTONS
           ========================================== */
        if (!prefersReducedMotion && !isMobile) {
            document.querySelectorAll('.btn-magnetic').forEach(btn => {
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;

                    // Cap the maximum magnetic pull to 8px
                    const cappedX = Math.min(Math.max(x * 0.3, -8), 8);
                    const cappedY = Math.min(Math.max(y * 0.3, -8), 8);

                    gsap.to(btn, {
                        x: cappedX,
                        y: cappedY,
                        duration: 0.4,
                        ease: 'power2.out'
                    });
                });
                btn.addEventListener('mouseleave', () => {
                    gsap.to(btn, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.3)' });
                });
            });
        }
    </script>
</body>

</html>
